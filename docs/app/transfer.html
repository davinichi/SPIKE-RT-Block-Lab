<!doctype html><html lang="ja"><meta charset="utf-8"><title>SBL-RT DFU・ログ</title><link rel="stylesheet" href="style.css"><article class="guide"><h1>SPIKE-RT 書き込み・USBログ</h1><p><a href="guide.html">初回準備・標準環境への復帰</a> ／ <a href="index.html">ブロック編集</a></p><p>Chrome / Edge用。SPIKE Prime Large Hubのみ。書き込みは標準Hub OSを置き換えます。Hub内の作品・設定・記録は失われる前提でPCへ退避してください。</p><p>① コンパイル済みの <code>asp.bin</code> を選択 → ② 対象を確認 → ③ 書き込み。</p><input id="firmware" type="file" accept=".bin"><pre id="info">未選択</pre><p><label><input id="confirm" type="checkbox">自分のSPIKE Prime Large Hubであり、バックアップと復帰手順を確認しました。このファイルでHub内を書き換えます。</label></p><button id="connect">DFUのHubを選択</button><button id="flash" disabled>確認して書き込む</button><p>通信確認は全バイトの読み戻し照合ではありません。書き込み後は再起動と表示・停止操作を確認します。</p><hr><button id="serial">USBシリアル接続（115200）</button><button id="closeSerial">ログを切断</button><button id="clear">ログを消去</button><pre id="log" aria-live="polite"></pre></article><script type="module" src="transfer.js"></script></html>
